[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jimmoria"
version = "0.1.0"
description = "JIMMORIA controlled P2P multi-agent runtime for a crypto research company MVP."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0.0"]
research = [
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.14.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
]
all = [
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.14.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "openai>=1.0.0",
]

[project.scripts]
jimmoria = "crypto_research_agents.cli:main"
crypto-research = "crypto_research_agents.cli:main"

[tool.setuptools.packages.find]
include = ["crypto_research_agents*"]

[tool.pytest.ini_options]
pythonpath = ["."]
