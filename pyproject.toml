[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jimmoria"
version = "0.1.0"
description = "JIMMORIA Hermes-led personal crypto research agent stack."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
llm = ["openai-codex"]
codex = ["openai-codex"]
research = [
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.14.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
]
all = [
    "beautifulsoup4>=4.12.0",
    "ddgs>=9.14.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "openai-codex",
]

[project.scripts]
jimmoria = "jimmoria.cli:main"
crypto-research = "jimmoria.cli:main"

[tool.setuptools.packages.find]
include = ["jimmoria*", "crypto_research_agents*"]

[tool.pytest.ini_options]
pythonpath = ["."]
