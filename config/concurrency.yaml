{
  "policy_version": "0.2",
  "active_phase": 3,
  "default_max_parallel": 7,
  "safety": {
    "shared_memory_writes": "lock_guarded",
    "report_writing": "post_swarm_single_writer",
    "obsidian_sync": "post_swarm_single_writer",
    "tool_calls": "read_only_or_artifact_write_only"
  },
  "phases": [
    {
      "phase": 3,
      "name": "full_parallel_research_swarm",
      "status": "active",
      "mode": "full_parallel_agent_swarm",
      "description": "After Hermes Agent seeds source and candidate context, ingestion, social/KOL, narrative, discovery, contract/on-chain, product/tech, and funding/token agents run at the same time. The council, report, final review, and Obsidian sync run only after the swarm joins.",
      "max_parallel": 7,
      "parallel_groups": [
        {
          "group_id": "research_swarm",
          "after_agent": "supervisor_agent",
          "agents": [
            "ingestion_agent",
            "social_kol_agent",
            "narrative_agent",
            "discovery_agent",
            "contract_onchain_agent",
            "product_tech_agent",
            "funding_token_agent"
          ],
          "join_before": "agent_council"
        }
      ]
    },
    {
      "phase": 4,
      "name": "parallel_research_rooms",
      "status": "planned",
      "mode": "room_worker_pool",
      "description": "Investigate Candidate A, B, C in separate Research Rooms at the same time, then merge room-level summaries.",
      "max_parallel": 3,
      "parallel_groups": [
        {
          "group_id": "candidate_rooms",
          "room_template": "project_research_room",
          "candidate_fanout": true,
          "join_before": "portfolio_or_daily_radar_summary"
        }
      ]
    }
  ]
}
