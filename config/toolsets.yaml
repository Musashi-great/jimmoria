version: 1
default_research_modes:
  - read_only
  - artifact_write

toolsets:
  supervisor_office:
    description: Hermes-inspired internal delegation tools for Hermes Agent task routing.
    tools:
      - classify_owner_request
      - choose_output_mode
      - create_research_room
      - create_task
      - assign_task
      - agent_handoff
      - update_task_status
      - read_agent_status
      - task_retry
      - task_cancel
      - update_personal_agent_settings
  personal_agent_stack:
    description: "Personal agent OS stack controlled by Hermes: Honcho memory, Obsidian vault, QMD search, CDP browser harness, Tavily search, and Codex local work."
    tools:
      - honcho_memory_search
      - honcho_observation_write
      - qmd_text_search
      - qmd_vector_search
      - qmd_vector_upsert
      - browser_cdp_navigate
      - browser_cdp_snapshot
      - browser_cdp_click
      - tavily_search
      - skill_view
      - read_file
      - search_files
      - write_file
      - execute_code
  honcho_memory:
    description: Honcho behavioral memory bridge for long-term user preference and behavior recall.
    tools:
      - honcho_memory_search
      - honcho_observation_write
  qmd_search:
    description: QMD device search bridge for local text and vector search.
    tools:
      - qmd_text_search
      - qmd_vector_search
      - qmd_vector_upsert
  browser_cdp:
    description: CDP browser harness tools for human-like public web exploration.
    tools:
      - browser_cdp_navigate
      - browser_cdp_snapshot
      - browser_cdp_click
  tavily_search:
    description: Tavily search API bridge for source discovery and query expansion.
    tools:
      - tavily_search
  research_basic:
    description: Public read-only research connectors.
    tools:
      - fetch_url
      - parse_html
      - archive_source_snapshot
      - web_search
      - crawl_website
      - crawl_docs
      - github_search_repos
      - read_github_repo
      - github_get_repo_activity
      - rss_monitor_feed
  research_guardrails:
    description: Hermes-inspired read-only guardrails for URL safety, source relevance, and repeated tool-call checks.
    tools:
      - url_safety_check
      - source_relevance_filter
      - tool_call_guardrail
  operator_research_bridge:
    description: Hermes-style operator tool names mapped into JIMMORIA's read-only/project-artifact research boundary.
    tools:
      - skill_view
      - read_file
      - browser_navigate
      - browser_console
      - browser_snapshot
      - browser_scroll
      - browser_click
      - search_files
      - execute_code
      - write_file
      - delegate_task
      - cronjob
      - multi_tool_use.parallel
  operator_blocked_or_external:
    description: Operator-style tools that are registered for audit clarity but blocked or require future external connectors.
    tools:
      - terminal
      - browser_vision
      - vision_analyze
      - send_message
  social_basic:
    description: Read-only public web and X/KOL signal connectors.
    tools:
      - x_search_posts
      - x_get_user_timeline
      - x_build_kol_list
  market_basic:
    description: Read-only market metadata for identity and context, not trading advice.
    tools:
      - dexscreener_search_pairs
      - coingecko_coin_metadata
      - rootdata_search_projects
      - rootdata_get_project
      - rootdata_get_investors
      - rootdata_get_hot_projects
      - defillama_protocol_search
      - defillama_tvl_snapshot
      - snapshot_get_proposals
  onchain_basic:
    description: Public on-chain read tools only.
    tools:
      - get_contract_address
      - explorer_lookup
      - explorer_get_contract_source
      - explorer_get_token_supply
      - explorer_get_token_holders
      - rpc_read_contract
      - get_token_metadata
      - get_dex_pair
      - thegraph_query_subgraph
      - dune_execute_query
  reporting:
    description: Local artifact and note writing.
    tools:
      - source_cache_write
      - render_markdown
      - write_note
      - artifact_store
  blocked_by_default:
    description: Explicitly blocked wallet, signing, and trading actions.
    tools:
      - wallet_sign
      - swap
      - approve
      - transfer
      - private_key_read
      - seed_phrase_read

tools:
  classify_owner_request:
    connector_name: classify_owner_request
    category: supervisor_office
    mode: read_only
    implementation_status: implemented
    description: Classify the owner message before deciding whether Hermes should chat, save settings, or open a Research Room.
  choose_output_mode:
    connector_name: choose_output_mode
    category: supervisor_office
    mode: read_only
    implementation_status: implemented
    description: Choose the owner-facing output mode for the current Hermes turn.
  create_research_room:
    connector_name: create_research_room
    category: supervisor_office
    mode: artifact_write
    implementation_status: implemented
    description: Record a Research Room opening as an auditable Hermes office action.
  create_task:
    connector_name: create_task
    category: supervisor_office
    mode: artifact_write
    implementation_status: implemented
    description: Create an internal task record from a process manifest.
  assign_task:
    connector_name: assign_task
    category: supervisor_office
    mode: artifact_write
    implementation_status: implemented
    description: Assign an internal task to a specialist agent.
  agent_handoff:
    connector_name: agent_handoff
    category: supervisor_office
    mode: artifact_write
    implementation_status: implemented
    description: Record a handoff between Hermes Agent and specialist agents.
  update_task_status:
    connector_name: update_task_status
    category: supervisor_office
    mode: artifact_write
    implementation_status: implemented
    description: Record task status transitions in the tool audit log.
  read_agent_status:
    connector_name: read_agent_status
    category: supervisor_office
    mode: read_only
    implementation_status: implemented
    description: Read a compact internal status snapshot for a room's agents.
  task_retry:
    connector_name: task_retry
    category: supervisor_office
    mode: artifact_write
    implementation_status: implemented
    description: Queue an internal task retry decision without invoking external tools.
  task_cancel:
    connector_name: task_cancel
    category: supervisor_office
    mode: artifact_write
    implementation_status: implemented
    description: Record an internal task cancellation decision.
  update_personal_agent_settings:
    connector_name: update_personal_agent_settings
    category: supervisor_office
    mode: artifact_write
    implementation_status: implemented
    description: Persist a personal-agent operating preference without opening a Research Room.
  delegate_task:
    connector_name: delegate_task
    category: supervisor_office
    mode: artifact_write
    implementation_status: implemented
    description: Hermes-style delegation alias that records an internal assignment through Hermes office.
  honcho_memory_search:
    connector_name: honcho_memory_search
    category: honcho_memory
    mode: read_only
    implementation_status: external_connector_required
    required_secrets: [HONCHO_API_KEY]
    description: Search Honcho behavioral memory for user preferences and long-term interaction patterns.
  honcho_observation_write:
    connector_name: honcho_observation_write
    category: honcho_memory
    mode: artifact_write
    implementation_status: external_connector_required
    required_secrets: [HONCHO_API_KEY]
    description: Write a durable behavioral observation to Honcho after Hermes decides it is stable memory.
  qmd_text_search:
    connector_name: qmd_text_search
    category: qmd_search
    mode: read_only
    implementation_status: external_connector_required
    required_secrets: [QMD_ENDPOINT]
    description: Search local device text through QMD.
  qmd_vector_search:
    connector_name: qmd_vector_search
    category: qmd_search
    mode: read_only
    implementation_status: external_connector_required
    required_secrets: [QMD_ENDPOINT]
    description: Search local vector memory through QMD.
  qmd_vector_upsert:
    connector_name: qmd_vector_upsert
    category: qmd_search
    mode: artifact_write
    implementation_status: external_connector_required
    required_secrets: [QMD_ENDPOINT]
    description: Upsert text into the QMD vector index.
  browser_cdp_navigate:
    connector_name: browser_cdp_navigate
    category: browser_cdp
    mode: read_only
    implementation_status: external_connector_required
    required_secrets: [BROWSER_CDP_ENDPOINT]
    description: Navigate a CDP browser session to a public URL.
  browser_cdp_snapshot:
    connector_name: browser_cdp_snapshot
    category: browser_cdp
    mode: read_only
    implementation_status: external_connector_required
    required_secrets: [BROWSER_CDP_ENDPOINT]
    description: Capture page text, links, and DOM snapshot through the CDP browser harness.
  browser_cdp_click:
    connector_name: browser_cdp_click
    category: browser_cdp
    mode: read_only
    implementation_status: external_connector_required
    required_secrets: [BROWSER_CDP_ENDPOINT]
    description: Click or navigate to a public link through the CDP browser harness.
  tavily_search:
    connector_name: tavily_search
    category: tavily_search
    mode: read_only
    implementation_status: external_connector_required
    required_secrets: [TAVILY_API_KEY]
    description: Search the public web through Tavily when an API key is configured.
  skill_view:
    connector_name: skill_view
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Load local JIMMORIA research playbooks such as representative Web3 diligence and xurl mapping.
  read_file:
    connector_name: read_file
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Read project-local files through a sensitive-path guard.
  search_files:
    connector_name: search_files
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Search project-local files for keywords without shell access.
  write_file:
    connector_name: write_file
    category: operator_bridge
    mode: artifact_write
    implementation_status: implemented
    description: Write local research artifacts only under data, reports, or vault.
  execute_code:
    connector_name: execute_code
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Run limited deterministic utility operations such as timestamp, JSON summary, and score aggregation. Arbitrary code is blocked.
  terminal:
    connector_name: terminal
    category: operator_bridge
    mode: dangerous
    implementation_status: implemented
    description: Registered for audit clarity but arbitrary terminal execution is blocked for agents.
  browser_navigate:
    connector_name: browser_navigate
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Stateless browser-style URL fetch mapped to the public URL fetcher.
  browser_console:
    connector_name: browser_console
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Extract document.body.innerText and links from a public URL using the stateless fetcher.
  browser_snapshot:
    connector_name: browser_snapshot
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Capture a text/link snapshot for a public URL.
  browser_scroll:
    connector_name: browser_scroll
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Stateless scroll approximation that refetches a public URL.
  browser_click:
    connector_name: browser_click
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Stateless click approximation that navigates to a supplied link URL.
  browser_vision:
    connector_name: browser_vision
    category: operator_bridge
    mode: read_only
    implementation_status: external_connector_required
    description: Future visual browser analysis connector; currently not enabled for agent runtime.
  vision_analyze:
    connector_name: vision_analyze
    category: operator_bridge
    mode: read_only
    implementation_status: external_connector_required
    description: Future image/vision analysis connector; currently not enabled for agent runtime.
  cronjob:
    connector_name: cronjob
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: List or evaluate configured local JIMMORIA scheduled jobs.
  send_message:
    connector_name: send_message
    category: operator_bridge
    mode: write
    implementation_status: implemented
    description: Registered for audit clarity but external message sending is disabled by default.
  multi_tool_use.parallel:
    connector_name: multi_tool_use.parallel
    category: operator_bridge
    mode: read_only
    implementation_status: implemented
    description: Records parallel-tool intent; actual parallel execution is handled by JIMMORIA concurrency phases.
  fetch_url:
    connector_name: fetch_url
    category: source_ingestion
    mode: read_only
    implementation_status: implemented
    description: Fetch a public URL and extract readable source text.
  parse_html:
    connector_name: parse_html
    category: source_ingestion
    mode: read_only
    implementation_status: implemented
    description: Parse fetched HTML into text, links, and metadata.
  archive_source_snapshot:
    connector_name: archive_source_snapshot
    category: source_ingestion
    mode: artifact_write
    implementation_status: implemented
    description: Persist source snapshots for replay and dedupe.
  url_safety_check:
    connector_name: url_safety_check
    category: research_guardrails
    mode: read_only
    implementation_status: implemented
    description: Classify URL safety and low-signal platform pages before using them as evidence.
  source_relevance_filter:
    connector_name: source_relevance_filter
    category: research_guardrails
    mode: read_only
    implementation_status: implemented
    description: Filter candidate source URLs against a project identity before report inclusion.
  tool_call_guardrail:
    connector_name: tool_call_guardrail
    category: research_guardrails
    mode: read_only
    implementation_status: implemented
    description: Hermes-inspired repeated-failure guardrail for research tool calls.
  web_search:
    connector_name: web_search
    category: discovery
    mode: read_only
    implementation_status: implemented
    description: Public web search for project and narrative evidence.
  crawl_website:
    connector_name: crawl_website
    category: product
    mode: read_only
    implementation_status: implemented
    description: Crawl public website metadata and product signals.
  crawl_docs:
    connector_name: crawl_docs
    category: product
    mode: read_only
    implementation_status: implemented
    description: Crawl project documentation.
  github_search_repos:
    connector_name: github_search_repos
    category: product
    mode: read_only
    implementation_status: implemented
    description: Search GitHub repositories for likely project code.
  read_github_repo:
    connector_name: read_github_repo
    category: product
    mode: read_only
    implementation_status: implemented
    description: Read public GitHub repository metadata.
  github_get_repo_activity:
    connector_name: github_get_repo_activity
    category: product
    mode: read_only
    implementation_status: implemented
    description: Read public GitHub commits, releases, and issues for product/activity evidence.
  rss_monitor_feed:
    connector_name: rss_monitor_feed
    category: monitor
    mode: read_only
    implementation_status: implemented
    description: Read RSS/Atom feeds for public project, docs, blog, and ecosystem signals.
  dexscreener_search_pairs:
    connector_name: dexscreener_search_pairs
    category: market
    mode: read_only
    implementation_status: implemented
    description: Search DEX Screener pairs as identity/context evidence.
  coingecko_coin_metadata:
    connector_name: coingecko_coin_metadata
    category: market
    mode: read_only
    implementation_status: implemented
    description: Read CoinGecko public metadata.
  defillama_protocol_search:
    connector_name: defillama_protocol_search
    category: market
    mode: read_only
    implementation_status: implemented
    description: Search DefiLlama public protocol metadata for DeFi narrative context.
  defillama_tvl_snapshot:
    connector_name: defillama_tvl_snapshot
    category: market
    mode: read_only
    implementation_status: implemented
    description: Read a DefiLlama protocol TVL snapshot as ecosystem context, not investment advice.
  snapshot_get_proposals:
    connector_name: snapshot_get_proposals
    category: governance
    mode: read_only
    implementation_status: implemented
    description: Read Snapshot governance proposals from the public Snapshot GraphQL API.
  x_search_posts:
    connector_name: x_search_posts
    category: social
    mode: read_only
    implementation_status: implemented
    required_secrets: [X_BEARER_TOKEN]
    description: Search public X posts for project and KOL mentions.
  x_get_user_timeline:
    connector_name: x_get_user_timeline
    category: social
    mode: read_only
    implementation_status: implemented
    required_secrets: [X_BEARER_TOKEN]
    description: Read a KOL timeline for repeated mentions.
  x_build_kol_list:
    connector_name: x_build_kol_list
    category: social
    mode: read_only
    implementation_status: implemented
    required_secrets: [X_BEARER_TOKEN]
    description: Build reusable KOL handle lists by narrative.
  rootdata_search_projects:
    connector_name: rootdata_search_projects
    category: discovery
    mode: read_only
    implementation_status: implemented
    required_secrets: [ROOTDATA_API_KEY]
    description: Search RootData project directory.
  rootdata_get_project:
    connector_name: rootdata_get_project
    category: discovery
    mode: read_only
    implementation_status: implemented
    required_secrets: [ROOTDATA_API_KEY]
    description: Fetch a RootData project profile by project_id or contract_address.
  rootdata_get_investors:
    connector_name: rootdata_get_investors
    category: discovery
    mode: read_only
    implementation_status: implemented
    required_secrets: [ROOTDATA_API_KEY]
    description: Fetch RootData investor directory pages.
  rootdata_get_hot_projects:
    connector_name: rootdata_get_hot_projects
    category: discovery
    mode: read_only
    implementation_status: implemented
    required_secrets: [ROOTDATA_API_KEY]
    description: Fetch RootData hot/trending project input when endpoint/query is available.
  get_contract_address:
    connector_name: get_contract_address
    category: onchain
    mode: read_only
    implementation_status: implemented
    required_secrets: [ETHERSCAN_API_KEY]
    description: Resolve public contract address data.
  explorer_lookup:
    connector_name: explorer_lookup
    category: onchain
    mode: read_only
    implementation_status: implemented
    required_secrets: [ETHERSCAN_API_KEY]
    description: Read public explorer metadata.
  explorer_get_contract_source:
    connector_name: explorer_get_contract_source
    category: onchain
    mode: read_only
    implementation_status: implemented
    required_secrets: [ETHERSCAN_API_KEY]
    description: Read verified contract source metadata from Etherscan V2.
  explorer_get_token_supply:
    connector_name: explorer_get_token_supply
    category: onchain
    mode: read_only
    implementation_status: implemented
    required_secrets: [ETHERSCAN_API_KEY]
    description: Read token supply from Etherscan V2.
  explorer_get_token_holders:
    connector_name: explorer_get_token_holders
    category: onchain
    mode: read_only
    implementation_status: implemented
    required_secrets: [ETHERSCAN_API_KEY]
    description: Read top token holders from Etherscan V2 when plan supports the endpoint.
  rpc_read_contract:
    connector_name: rpc_read_contract
    category: onchain
    mode: read_only
    implementation_status: implemented
    required_secrets: [ETH_RPC_URL]
    description: Execute read-only JSON-RPC eth_call against a configured RPC endpoint.
  get_token_metadata:
    connector_name: get_token_metadata
    category: onchain
    mode: read_only
    implementation_status: implemented
    description: Read token metadata from public sources.
  get_dex_pair:
    connector_name: get_dex_pair
    category: onchain
    mode: read_only
    implementation_status: implemented
    description: Read public DEX pair metadata.
  dune_execute_query:
    connector_name: dune_execute_query
    category: onchain
    mode: read_only
    implementation_status: external_connector_required
    required_secrets: [DUNE_API_KEY]
    description: Execute read-only Dune queries when a Dune API key is configured.
  thegraph_query_subgraph:
    connector_name: thegraph_query_subgraph
    category: onchain
    mode: read_only
    implementation_status: external_connector_required
    required_secrets: [THEGRAPH_API_KEY]
    description: Query a configured The Graph subgraph endpoint when credentials are configured.
  check_airdrop_points:
    connector_name: check_airdrop_points
    category: opportunity
    mode: read_only
    implementation_status: implemented
    description: Search public web results for points, airdrop, reward, quest, and testnet hints.
  source_cache_write:
    connector_name: source_cache_write
    category: artifact
    mode: artifact_write
    implementation_status: planned
    description: Write source cache artifacts.
  render_markdown:
    connector_name: render_markdown
    category: report
    mode: artifact_write
    implementation_status: planned
    description: Render markdown reports locally.
  write_note:
    connector_name: write_note
    category: obsidian
    mode: artifact_write
    implementation_status: planned
    description: Write Obsidian-compatible notes.
  artifact_store:
    connector_name: artifact_store
    category: artifact
    mode: artifact_write
    implementation_status: implemented
    description: Archive run/session artifacts.
  wallet_sign:
    category: dangerous
    mode: dangerous
    implementation_status: blocked
    description: Blocked. JIMMORIA never signs wallet transactions.
  swap:
    category: dangerous
    mode: dangerous
    implementation_status: blocked
    description: Blocked. JIMMORIA never swaps or trades.
  approve:
    category: dangerous
    mode: dangerous
    implementation_status: blocked
    description: Blocked. JIMMORIA never approves token allowances.
  transfer:
    category: dangerous
    mode: dangerous
    implementation_status: blocked
    description: Blocked. JIMMORIA never transfers assets.
  private_key_read:
    category: dangerous
    mode: dangerous
    implementation_status: blocked
    description: Blocked. JIMMORIA never reads private keys.
  seed_phrase_read:
    category: dangerous
    mode: dangerous
    implementation_status: blocked
    description: Blocked. JIMMORIA never reads seed phrases.
