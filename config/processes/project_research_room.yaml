{
  "process_id": "project_research_room",
  "name": "Project Research Room",
  "process_type": "sequential_controlled_p2p",
  "supervisor_mode": "company_ceo_manager",
  "execution_strategy": {
    "current_phase": 1,
    "current_mode": "sequential",
    "phase_1": "Run the full Research Room sequentially until the room is stable end-to-end.",
    "phase_2": "After discovery_agent, re-run candidate-specific social_kol_agent plus contract_onchain_agent, product_tech_agent, and funding_token_agent in one bounded evidence_checks group.",
    "phase_3": "Run 24H monitor collectors for X/KOL, articles, GitHub, Docs, DEX, RSS, RootData, and public web sources in parallel into a signal queue.",
    "phase_4": "Run multiple candidate Research Rooms in parallel and merge their room-level summaries."
  },
  "inspired_by": [
    "ChatDev configurable workflows/phases/roles",
    "crewAI agents.yaml + tasks.yaml + Process.sequential",
    "Hermes Agent toolsets and delegation-style subagent task routing"
  ],
  "goals": [
    "Store and summarize the source or user request.",
    "Collect X/Twitter, KOL, public posting, and article market signals first.",
    "Resolve the project identity and market narrative from those signals.",
    "Verify the project through official site, docs, GitHub, token, and market metadata.",
    "Create a project intelligence dossier and Obsidian notes."
  ],
  "tasks": [
    {
      "task_id": "orchestrate_room",
      "agent_id": "supervisor_agent",
      "phase": "management",
      "description": "Set research objective, priority, agent order, quality bar, handoff checkpoints, Agent Council role, and final output mode.",
      "expected_output": "Orchestration plan with intake decision, room goals, delegated tasks, and coordination checkpoints.",
      "output_channels": ["finding", "event"]
    },
    {
      "task_id": "ingest_source",
      "agent_id": "ingestion_agent",
      "phase": "source_memory",
      "requires": ["orchestrate_room"],
      "description": "Store source text/URL and extract entities, keywords, metadata, canonical links, and source note candidates.",
      "expected_output": "SourceRecord plus ingestion finding.",
      "output_channels": ["memory.sources", "finding", "obsidian.source"]
    },
    {
      "task_id": "collect_market_signal",
      "agent_id": "social_kol_agent",
      "phase": "market_signal_intake",
      "requires": ["ingest_source"],
      "description": "Use X/Twitter recent search when credentials exist, plus public web searches for X posts, KOL opinions, threads, and articles. This is the first research evidence layer.",
      "expected_output": "Market signal intake finding with X API status, public X web hits, KOL/profile candidates, article hits, and source priority.",
      "output_channels": ["finding", "tool_audit", "bus.update"]
    },
    {
      "task_id": "map_narratives",
      "agent_id": "narrative_agent",
      "phase": "thesis_mapping",
      "requires": ["collect_market_signal"],
      "description": "Classify the source and market-signal intake into crypto market narratives and thesis categories.",
      "expected_output": "Narrative finding with categories and confidence.",
      "output_channels": ["finding", "memory.entity_graph"]
    },
    {
      "task_id": "discover_candidates",
      "agent_id": "discovery_agent",
      "phase": "candidate_discovery",
      "requires": ["map_narratives"],
      "description": "Resolve named projects or find early project candidates from narrative, X/KOL, article, public web, and source signals.",
      "expected_output": "ProjectCandidate records with origin/source_backing labels and social-first evidence where available.",
      "output_channels": ["memory.projects", "finding", "bus.requests"]
    },
    {
      "task_id": "check_social_kol",
      "agent_id": "social_kol_agent",
      "phase": "evidence_checks",
      "requires": ["discover_candidates"],
      "description": "Run candidate-specific social verification after discovery: official X handles, KOL mentions, community links, and public social evidence.",
      "expected_output": "Candidate-specific Social/KOL finding with citations or connector limitations.",
      "output_channels": ["finding", "tool_audit"]
    },
    {
      "task_id": "check_contract_onchain",
      "agent_id": "contract_onchain_agent",
      "phase": "evidence_checks",
      "requires": ["discover_candidates"],
      "description": "Verify chain, token identity, contract, DEX/explorer metadata, and ambiguity risk.",
      "expected_output": "Contract/on-chain finding with token status and unresolved risks.",
      "output_channels": ["finding", "tool_audit"]
    },
    {
      "task_id": "check_product_tech",
      "agent_id": "product_tech_agent",
      "phase": "evidence_checks",
      "requires": ["discover_candidates"],
      "description": "Verify what the project is after market-signal discovery by checking website, docs, GitHub, product surface, and implementation readiness.",
      "expected_output": "Product/tech finding with official links and product maturity.",
      "output_channels": ["finding", "tool_audit"]
    },
    {
      "task_id": "check_funding_token",
      "agent_id": "funding_token_agent",
      "phase": "opportunity_checks",
      "requires": ["discover_candidates"],
      "description": "Review investors, funding hints, token status, points, airdrop, and opportunity windows.",
      "expected_output": "Funding/token finding with opportunity and uncertainty labels.",
      "output_channels": ["finding", "tool_audit"]
    },
    {
      "task_id": "write_dossier",
      "agent_id": "report_agent",
      "phase": "synthesis",
      "requires": [
        "check_social_kol",
        "check_contract_onchain",
        "check_product_tech",
        "check_funding_token"
      ],
      "description": "Turn agent findings into a human-readable project research dossier.",
      "expected_output": "Markdown dossier with TL;DR, candidate table, evidence, risks, and next questions.",
      "output_channels": ["report", "finding"]
    },
    {
      "task_id": "sync_obsidian",
      "agent_id": "obsidian_curator_agent",
      "phase": "knowledge_ops",
      "requires": ["write_dossier"],
      "description": "Save sources, candidates, narratives, and reports into the local Obsidian-style vault.",
      "expected_output": "Vault notes and links for long-term memory.",
      "output_channels": ["obsidian.project", "obsidian.source", "obsidian.report"]
    }
  ],
  "artifact_contracts": {
    "source": "SharedMemory.sources + vault/20_Sources",
    "candidate": "SharedMemory.projects + source_backing/origin fields",
    "finding": "SharedMemory.findings",
    "report": "reports/*.md + vault/50_Reports",
    "replay": "data/runs/<room_id>/events.json"
  },
  "ui": {
    "default_event_style": "stream",
    "dock": "JIMMORIA HQ runtime dock remains visible while a room runs",
    "board_command": "/board",
    "supervisor_office": "Supervisor creates and assigns task records before specialist agents run",
    "agent_council": "Specialist findings are deliberated before report writing",
    "final_review": "Supervisor reviews report quality and delivery mode before Obsidian sync"
  },
  "memory_policy": {
    "save_run": true,
    "save_llm_call_log": true,
    "save_tool_audit_log": true,
    "dedupe_sources": true
  }
}
