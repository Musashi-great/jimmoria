{
  "process_id": "project_research_room",
  "name": "Representative Web3 Project Research Room",
  "process_type": "controlled_p2p_full_parallel_research_swarm",
  "supervisor_mode": "company_ceo_manager",
  "execution_strategy": {
    "current_phase": 3,
    "current_mode": "full_parallel_agent_swarm",
    "phase_3": "Supervisor seeds the source/candidate context, then ingestion, social/KOL, narrative, discovery, contract/on-chain, product/tech, and funding/token agents run together as research_swarm.",
    "phase_4": "Run multiple candidate Research Rooms in parallel and merge room-level summaries."
  },
  "inspired_by": [
    "ChatDev configurable workflows/phases/roles",
    "crewAI agents.yaml + tasks.yaml role/task separation",
    "Hermes Agent toolsets and delegation-style subagent task routing",
    "Representative Web3 project/token diligence profile"
  ],
  "playbooks": [
    "representative_web3_project_diligence",
    "ticker_collision_review",
    "kol_shill_quality_review",
    "base_token_identity_gate"
  ],
  "goals": [
    "Treat the user trigger as a candidate only until Identity Gate passes.",
    "Collect X/Twitter, KOL, public post, and article market signals as the first evidence layer.",
    "Resolve project identity: name, ticker, chain, CA, official site, official X, docs, GitHub, DEX/explorer, ticker collision, unofficial CA, and relaunch history.",
    "Explain the project first: what it does, who uses it, what product exists, and what problem it solves.",
    "Verify product and operator evidence through site, docs, app, GitHub, repo activity, packages, SDK/API, and live infra where available.",
    "Check token, contract, security, market, and value-capture evidence without over-weighting LP/holder/liquidity unless fatal.",
    "Separate identity, founder, product maturity, security/audit, token value-capture, and social/shill risks.",
    "Create a Korean project intelligence report plus a separate evidence packet."
  ],
  "tasks": [
    {
      "task_id": "orchestrate_room",
      "agent_id": "supervisor_agent",
      "phase": "management",
      "description": "Act as company CEO/orchestrator: confirm this is a report request, set the diligence plan, apply the representative Web3 profile, assign specialists, and define final review gates.",
      "expected_output": "Orchestration plan with intent, Identity Gate, task delegation, debate checkpoints, final report mode, and evidence packet requirement.",
      "output_channels": ["finding", "event"]
    },
    {
      "task_id": "ingest_source",
      "agent_id": "ingestion_agent",
      "phase": "research_swarm",
      "requires": ["orchestrate_room"],
      "description": "Store source text/URL/name/CA and extract entities, ticker hints, official-link candidates, keywords, metadata, and source note candidates.",
      "expected_output": "SourceRecord plus ingestion finding with identity hints.",
      "output_channels": ["memory.sources", "finding", "obsidian.source"]
    },
    {
      "task_id": "collect_market_signal",
      "agent_id": "social_kol_agent",
      "phase": "research_swarm",
      "requires": ["orchestrate_room"],
      "description": "Use X/Twitter recent search when credentials exist, plus public web searches for X posts, KOL opinions, threads, official posts, builder/ecosystem mentions, controversies, clarifications, and articles. Telegram and Discord are out of scope.",
      "expected_output": "Market signal intake finding with X API status, public X web hits, official/candidate X handles, timeline status, KOL/profile candidates, who-said-what rows, article hits, official-post hints, and shill/controversy flags.",
      "output_channels": ["finding", "tool_audit", "bus.update"]
    },
    {
      "task_id": "map_narratives",
      "agent_id": "narrative_agent",
      "phase": "research_swarm",
      "requires": ["orchestrate_room"],
      "description": "Classify the market-signal intake into crypto narratives and separate hype narrative from product thesis.",
      "expected_output": "Narrative finding with categories, confidence, and why this narrative matters.",
      "output_channels": ["finding", "memory.entity_graph"]
    },
    {
      "task_id": "identity_gate_and_discovery",
      "agent_id": "discovery_agent",
      "phase": "research_swarm",
      "requires": ["orchestrate_room"],
      "description": "Run Identity Gate before judgment: resolve official project, ticker, chain, CA, site, X, docs, GitHub, DEX/explorer, ticker collision, unofficial CA, and relaunch history. Only then create source-backed ProjectCandidate records.",
      "expected_output": "ProjectCandidate records with candidate_origin/source_backing labels, identity confidence, collision notes, and official evidence URLs.",
      "output_channels": ["memory.projects", "finding", "bus.requests"]
    },
    {
      "task_id": "check_social_kol",
      "agent_id": "social_kol_agent",
      "phase": "research_swarm",
      "requires": ["orchestrate_room"],
      "description": "Run candidate-specific social verification: official X handle, recent official posts, KOL thesis, builder/ecosystem mentions, controversy/clarification, and social/shill risk.",
      "expected_output": "Candidate-specific Social/KOL finding with who said what, links, confidence, and unresolved gaps.",
      "output_channels": ["finding", "tool_audit"]
    },
    {
      "task_id": "check_contract_onchain",
      "agent_id": "contract_onchain_agent",
      "phase": "research_swarm",
      "requires": ["orchestrate_room"],
      "description": "Verify chain, token identity, contract, DEX/explorer metadata, security background, tax/mintability/honeypot/launchpad status where available. Keep LP/holder/liquidity short unless fatal.",
      "expected_output": "Contract/on-chain finding with official vs unofficial CA separation, security flags, and token status.",
      "output_channels": ["finding", "tool_audit"]
    },
    {
      "task_id": "check_product_tech",
      "agent_id": "product_tech_agent",
      "phase": "research_swarm",
      "requires": ["orchestrate_room"],
      "description": "Verify product reality through website, docs, app, GitHub, repo structure, recent commits, contracts, circuits, SDK, tests, docs, package releases, API, and live infra where available.",
      "expected_output": "Product/tech finding with what the project does, operator evidence, GitHub/docs maturity, and live infra response status.",
      "output_channels": ["finding", "tool_audit"]
    },
    {
      "task_id": "check_funding_token",
      "agent_id": "funding_token_agent",
      "phase": "research_swarm",
      "requires": ["orchestrate_room"],
      "description": "Review founder dossier, investor/funding evidence, point/airdrop hints, token status, and token value-capture: why token is needed, who pays, fee/gas/burn/buyback/staking/revenue connection, and live vs roadmap separation.",
      "expected_output": "Founder/funding/token finding with sourced founder data, value-capture analysis, and uncertainty labels.",
      "output_channels": ["finding", "tool_audit"]
    },
    {
      "task_id": "agent_council_deliberation",
      "agent_id": "supervisor_agent",
      "phase": "deliberation",
      "requires": [
        "ingest_source",
        "collect_market_signal",
        "map_narratives",
        "identity_gate_and_discovery",
        "check_social_kol",
        "check_contract_onchain",
        "check_product_tech",
        "check_funding_token"
      ],
      "description": "Merge specialist findings into a consensus before report writing. Separate confirmed facts, unresolved claims, blockers, and report direction.",
      "expected_output": "Council consensus with specialist statements, blockers, confidence, and report direction.",
      "output_channels": ["finding", "bus.handoff", "event"]
    },
    {
      "task_id": "write_dossier",
      "agent_id": "report_agent",
      "phase": "synthesis",
      "requires": [
        "agent_council_deliberation"
      ],
      "description": "Write the Korean project intelligence report for the client. It must explain the project, not the agent workflow. Conclusion first, then identity, product, narrative, social/KOL, founder, token value-capture, risks, score/stance, and sources.",
      "expected_output": "Markdown project intelligence dossier plus evidence packet with Identity, What changed, Product/Operator Evidence, Founder Dossier, On-chain/Market, Social Signal, Risks, Scores, AntSeed Peer Review, and Stance.",
      "output_channels": ["report", "evidence_packet", "finding"]
    },
    {
      "task_id": "supervisor_final_review",
      "agent_id": "supervisor_agent",
      "phase": "final_review",
      "requires": ["write_dossier"],
      "description": "Final CEO/orchestrator review before delivery: check quality gate, claim coverage, score framing, missing evidence, and whether the report should be delivered as final report or diagnostic memo.",
      "expected_output": "Final delivery decision with approved_for_delivery, delivery_mode, required follow-ups, and evidence gaps.",
      "output_channels": ["finding", "event", "bus.update"]
    },
    {
      "task_id": "sync_obsidian",
      "agent_id": "obsidian_curator_agent",
      "phase": "knowledge_ops",
      "requires": ["supervisor_final_review"],
      "description": "Save sources, candidates, narratives, reports, and evidence packet links into the local Obsidian-style vault.",
      "expected_output": "Vault notes and links for long-term memory.",
      "output_channels": ["obsidian.project", "obsidian.source", "obsidian.report"]
    }
  ],
  "artifact_contracts": {
    "source": "SharedMemory.sources + vault/20_Sources",
    "candidate": "SharedMemory.projects + source_backing/origin fields",
    "finding": "SharedMemory.findings",
    "report": "reports/*.md + vault/50_Reports",
    "evidence_packet": "data/evidence_packets/*.md",
    "replay": "data/runs/<room_id>/events.json"
  },
  "ui": {
    "default_event_style": "stream",
    "dock": "JIMMORIA HQ runtime dock remains visible while a room runs",
    "board_command": "/board",
    "supervisor_office": "Supervisor creates and assigns task records before specialist agents run",
    "agent_council": "Specialist findings are deliberated before report writing",
    "final_review": "Supervisor reviews report quality, evidence packet, and delivery mode before Obsidian sync"
  },
  "memory_policy": {
    "save_run": true,
    "save_llm_call_log": true,
    "save_tool_audit_log": true,
    "dedupe_sources": true
  }
}
