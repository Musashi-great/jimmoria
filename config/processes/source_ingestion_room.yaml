{
  "process_id": "source_ingestion_room",
  "name": "Source Ingestion Room",
  "process_type": "source_only_controlled_p2p",
  "supervisor_mode": "company_ceo_manager",
  "inspired_by": [
    "crewAI task-specific role/task separation",
    "ChatDev phase-limited workflow",
    "Hermes Agent toolsets and delegation-style subagent task routing"
  ],
  "goals": [
    "Store the source.",
    "Extract metadata.",
    "Create an Obsidian Source Note."
  ],
  "tasks": [
    {
      "task_id": "orchestrate_ingestion_room",
      "agent_id": "supervisor_agent",
      "phase": "management",
      "description": "Confirm this is source-only work, choose the minimal agent path, set handoff checkpoints, and prevent unnecessary research/report generation.",
      "expected_output": "Orchestration plan for source-only ingestion.",
      "output_channels": ["finding", "event"]
    },
    {
      "task_id": "ingest_source",
      "agent_id": "ingestion_agent",
      "phase": "source_memory",
      "requires": ["orchestrate_ingestion_room"],
      "description": "Store source text/URL and extract metadata, entities, keywords, canonical links, and source hash.",
      "expected_output": "SourceRecord plus ingestion finding.",
      "output_channels": ["memory.sources", "finding", "obsidian.source"]
    },
    {
      "task_id": "sync_source_note",
      "agent_id": "obsidian_curator_agent",
      "phase": "knowledge_ops",
      "requires": ["ingest_source"],
      "description": "Save the source note into the local Obsidian-style vault without creating a full project dossier.",
      "expected_output": "Vault Source note.",
      "output_channels": ["obsidian.source"]
    }
  ],
  "artifact_contracts": {
    "source": "SharedMemory.sources + vault/20_Sources",
    "replay": "data/runs/<room_id>/events.json"
  },
  "ui": {
    "default_event_style": "stream",
    "dock": "JIMMORIA HQ runtime dock remains visible while a room runs",
    "supervisor_office": "Supervisor creates and assigns task records before specialist agents run"
  },
  "memory_policy": {
    "save_run": true,
    "save_llm_call_log": true,
    "save_tool_audit_log": true,
    "dedupe_sources": true
  }
}
