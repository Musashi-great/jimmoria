{
  "provider": "codex_or_grok",
  "official_docs": {
    "codex_sdk": "https://developers.openai.com/codex/sdk",
    "codex_models": "https://developers.openai.com/codex/models",
    "xai_rest_api": "https://docs.x.ai/developers/rest-api-reference",
    "xai_models": "https://docs.x.ai/docs/models/",
    "xai_reasoning": "https://docs.x.ai/developers/model-capabilities/text/reasoning"
  },
  "runtime_order": [
    "codex_grok",
    "codex_sdk",
    "codex_cli",
    "xai_oauth",
    "grok",
    "offline_diagnostic_fallback"
  ],
  "env": {
    "provider": "LLM_PROVIDER",
    "hybrid_codex_provider": "JIMMORIA_CODEX_PROVIDER",
    "hybrid_grok_auth_provider": "JIMMORIA_GROK_AUTH_PROVIDER",
    "hybrid_grok_tasks": "JIMMORIA_GROK_TASKS",
    "hybrid_grok_agents": "JIMMORIA_GROK_AGENTS",
    "hybrid_grok_fallback_to_codex": "JIMMORIA_GROK_FALLBACK_TO_CODEX",
    "disable_hybrid_grok_fallback": "JIMMORIA_DISABLE_GROK_FALLBACK",
    "agent_provider_override": "JIMMORIA_AGENT_PROVIDER_<AGENT_ID>",
    "codex_sdk_sandbox": "CODEX_SDK_SANDBOX",
    "codex_sdk_approval_mode": "CODEX_SDK_APPROVAL_MODE",
    "codex_sdk_cwd": "CODEX_SDK_CWD",
    "codex_cli_command": "CODEX_CLI_COMMAND",
    "codex_cli_timeout": "CODEX_CLI_TIMEOUT",
    "codex_fast_chat_model": "CODEX_MODEL_FAST_CHAT",
    "codex_fast_model": "CODEX_MODEL_FAST",
    "codex_reasoning_model": "CODEX_MODEL_REASONING",
    "codex_writing_model": "CODEX_MODEL_WRITING",
    "codex_strong_model": "CODEX_MODEL_STRONG",
    "legacy_cli_fast_chat_model": "CODEX_CLI_MODEL_FAST_CHAT",
    "legacy_cli_fast_model": "CODEX_CLI_MODEL_FAST",
    "legacy_cli_reasoning_model": "CODEX_CLI_MODEL_REASONING",
    "legacy_cli_writing_model": "CODEX_CLI_MODEL_WRITING",
    "legacy_cli_strong_model": "CODEX_CLI_MODEL_STRONG",
    "grok_api_key": "GROK_API_KEY",
    "xai_api_key": "XAI_API_KEY",
    "hermes_home": "HERMES_HOME",
    "hermes_auth_json": "HERMES_AUTH_JSON",
    "grok_oauth_token": "GROK_OAUTH_TOKEN",
    "xai_oauth_token": "XAI_OAUTH_TOKEN",
    "grok_oauth_token_file": "GROK_OAUTH_TOKEN_FILE",
    "xai_oauth_token_file": "XAI_OAUTH_TOKEN_FILE",
    "grok_oauth_token_command": "GROK_OAUTH_TOKEN_COMMAND",
    "xai_oauth_token_command": "XAI_OAUTH_TOKEN_COMMAND",
    "grok_base_url": "GROK_BASE_URL",
    "xai_base_url": "XAI_BASE_URL",
    "grok_api_mode": "GROK_API_MODE",
    "grok_fast_chat_model": "GROK_MODEL_FAST_CHAT",
    "grok_fast_model": "GROK_MODEL_FAST",
    "grok_reasoning_model": "GROK_MODEL_REASONING",
    "grok_writing_model": "GROK_MODEL_WRITING",
    "grok_strong_model": "GROK_MODEL_STRONG"
  },
  "supported_models": {
    "codex": [
      "gpt-5.5",
      "gpt-5.4",
      "gpt-5.4-mini",
      "gpt-5.3-codex",
      "gpt-5.3-codex-spark"
    ],
    "grok": [
      "grok-4.3",
      "grok-4.3-latest",
      "grok-latest",
      "grok-4.20",
      "grok-4.20-reasoning",
      "grok-4.20-multi-agent"
    ]
  },
  "defaults": {
    "codex": {
      "fast_chat_model": "gpt-5.4-mini",
      "fast_model": "gpt-5.4-mini",
      "reasoning_model": "gpt-5.5",
      "writing_model": "gpt-5.5",
      "strong_model": "gpt-5.5"
    },
    "grok": {
      "fast_chat_model": "grok-4.3",
      "fast_model": "grok-4.3",
      "reasoning_model": "grok-4.3",
      "writing_model": "grok-4.3",
      "strong_model": "grok-4.3"
    },
    "reasoning_effort": "pro"
  },
  "reasoning_effort": {
    "default": "pro",
    "codex_cli_config_key": "model_reasoning_effort",
    "codex_cli_pro_value": "xhigh",
    "grok_responses_key": "reasoning.effort",
    "grok_pro_value": "high",
    "applies_to": [
      "supervision",
      "source_ingestion",
      "narrative_reasoning",
      "candidate_discovery",
      "social_summary",
      "contract_info",
      "product_docs",
      "funding_token",
      "obsidian_sync",
      "report_writing",
      "final_synthesis"
    ]
  },
  "routes": {
    "supervisor_chat": "fast_chat_model",
    "source_ingestion": "reasoning_model",
    "narrative_reasoning": "reasoning_model",
    "supervision": "reasoning_model",
    "candidate_discovery": "reasoning_model",
    "social_summary": "reasoning_model",
    "contract_info": "reasoning_model",
    "product_docs": "reasoning_model",
    "funding_token": "reasoning_model",
    "obsidian_sync": "reasoning_model",
    "report_writing": "writing_model",
    "final_synthesis": "writing_model",
    "embedding_search": "embedding_model"
  },
  "hybrid_provider_routes": {
    "provider": "codex_grok",
    "default_provider_family": "codex",
    "agent_provider_families": {
      "supervisor_agent": "codex",
      "ingestion_agent": "codex",
      "narrative_agent": "grok",
      "discovery_agent": "grok",
      "social_kol_agent": "grok",
      "contract_onchain_agent": "codex",
      "product_tech_agent": "codex",
      "funding_token_agent": "codex",
      "report_agent": "codex",
      "obsidian_curator_agent": "codex"
    },
    "grok_task_types": [
      "candidate_discovery",
      "narrative_reasoning",
      "social_summary"
    ],
    "grok_agent_ids": [
      "social_kol_agent"
    ],
    "codex_task_types": [
      "supervisor_chat",
      "supervision",
      "source_ingestion",
      "contract_info",
      "product_docs",
      "funding_token",
      "obsidian_sync",
      "report_writing",
      "final_synthesis"
    ],
    "notes": [
      "Codex remains the final-writing and orchestration provider.",
      "Grok is used where X/KOL, narrative, and candidate discovery benefit from xAI/Grok context.",
      "If a Grok route fails in hybrid mode, JIMMORIA retries the same task through Codex by default and records the fallback in llm_call_log.json.",
      "Set JIMMORIA_GROK_FALLBACK_TO_CODEX=0 or JIMMORIA_DISABLE_GROK_FALLBACK=1 to disable the hybrid fallback.",
      "Agent-level provider families are applied before task-type fallbacks.",
      "Override a single agent with JIMMORIA_AGENT_PROVIDER_<AGENT_ID>=codex or grok.",
      "Use LLM_PROVIDER=codex_grok for role routing; xai_oauth is a Grok credential mode, not the hybrid company mode."
    ]
  },
  "fallback": {
    "provider": "offline_diagnostic_fallback",
    "behavior": "deterministic local extraction and summarization for tests only"
  },
  "notes": [
    "Codex remains the recommended default because it can reuse the local ChatGPT/Codex login.",
    "Grok/xAI is available through Hermes xAI OAuth (LLM_PROVIDER=xai_oauth) and through the OpenAI-compatible xAI API at https://api.x.ai/v1.",
    "Hermes xAI OAuth uses accounts.x.ai and stores tokens in ~/.hermes/auth.json; JIMMORIA imports the runtime bearer without persisting token material.",
    "JIMMORIA also accepts explicit bearer token env/file/command sources for operator workflows.",
    "Raw Grok/XAI bearer tokens are not persisted in data/model_settings.json; only file paths, commands, base URL, API mode, and model route preferences are saved.",
    "Grok defaults to the Responses API so reasoning.effort can be mapped from JIMMORIA pro/high/standard/fast effort levels."
  ]
}
