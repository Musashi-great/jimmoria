{
  "stack_id": "jimmoria_personal_agent_stack",
  "product_frame": "personal_agent_os",
  "display_name": "JIMMORIA Personal Agent",
  "orchestrator": {
    "name": "Hermes Agent",
    "internal_agent_id": "supervisor_agent",
    "role": "single personal agent harness and central orchestrator"
  },
  "principles": [
    "The user is the owner, not a client of a company.",
    "Hermes Agent is the only front door: conversation, memory, planning, browsing, search, notes, and Codex work are routed through Hermes.",
    "Use specialist agents as internal skills or subroutines, not as a visible company org chart.",
    "Keep raw logs in artifacts; keep the visible UI focused on what Hermes and each tool layer are doing now.",
    "Never trade, sign wallets, manage assets, or provide buy/sell instructions."
  ],
  "layers": [
    {
      "id": "hermes_harness",
      "name": "Hermes Agent",
      "kind": "agent_harness",
      "status": "implemented",
      "purpose": "Own the conversation, decide the next action, delegate subroutines, and approve final output.",
      "tools": ["create_research_room", "create_task", "assign_task", "agent_handoff", "read_agent_status", "delegate_task"],
      "required_env": []
    },
    {
      "id": "honcho_memory",
      "name": "Honcho",
      "kind": "behavior_memory",
      "status": "external_connector_required",
      "purpose": "Long-term behavioral memory and user preference modeling.",
      "tools": ["honcho_memory_search", "honcho_observation_write"],
      "required_env": ["HONCHO_API_KEY"]
    },
    {
      "id": "obsidian_vault",
      "name": "Obsidian",
      "kind": "knowledge_vault",
      "status": "implemented",
      "purpose": "Local knowledge vault for durable notes, dossiers, source notes, and thesis memory.",
      "tools": ["write_note", "artifact_store", "source_cache_write"],
      "required_env": []
    },
    {
      "id": "qmd_search",
      "name": "QMD",
      "kind": "device_search",
      "status": "external_connector_required",
      "purpose": "Device search engine for local text and vector retrieval.",
      "tools": ["qmd_text_search", "qmd_vector_search", "qmd_vector_upsert"],
      "required_env": ["QMD_ENDPOINT"]
    },
    {
      "id": "browser_harness",
      "name": "Browser Harness",
      "kind": "cdp_browser_automation",
      "status": "external_connector_required",
