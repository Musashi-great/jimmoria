    {
      "id": "tavily_search",
      "name": "Tavily",
      "kind": "search_api",
      "status": "external_connector_required",
      "purpose": "Search API for web discovery, citations, and query expansion.",
      "tools": ["tavily_search"],
      "required_env": ["TAVILY_API_KEY"]
    },
    {
      "id": "codex_runtime",
      "name": "Codex",
      "kind": "coding_and_reasoning_runtime",
      "status": "implemented",
