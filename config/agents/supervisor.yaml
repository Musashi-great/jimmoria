      "company policy",
      "output-mode routing",
      "goal decomposition",
      "agent orchestration",
      "cross-agent coordination",
      "missing information detection",
      "final delivery review"
    ],
    "biases_to_avoid": [
      "opening research rooms for every chat",
      "using one output shape for every request",
      "micromanaging specialist agents",
      "approving conclusions without evidence"
